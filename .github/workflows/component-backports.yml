name: Bounded backport component tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        illuminate: ['10.49.0', '11.51.0']
    steps:
      - uses: actions/checkout@v4
      - name: Name candidate branch for truthful Composer path version
        run: git checkout -B flashasia-backports
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, mbstring, fileinfo
          tools: composer:2.10.3
          coverage: none
      - name: Resolve real component consumer graph
        run: |
          php tests/Component/prepare.php '${{ matrix.illuminate }}' "$RUNNER_TEMP/mediable-components"
          composer update --working-dir="$RUNNER_TEMP/mediable-components" --no-interaction --prefer-dist
          composer audit --working-dir="$RUNNER_TEMP/mediable-components"
      - name: Run bounded component regression tests
        env:
          COMPONENT_AUTOLOAD: ${{ runner.temp }}/mediable-components/vendor/autoload.php
        run: php tests/Component/run-bounded.php BackportTest.php "$RUNNER_TEMP/component-junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-${{ matrix.illuminate }}-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/mediable-components/composer.json
            ${{ runner.temp }}/mediable-components/composer.lock
            ${{ runner.temp }}/component-junit.xml

  mysql-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        illuminate: ['10.49.0', '11.51.0']
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Name candidate branch for truthful Composer path version
        run: git checkout -B flashasia-backports
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_mysql, pdo_sqlite, mbstring, fileinfo
          tools: composer:2.10.3
          coverage: none
      - name: Resolve real component consumer graph
        run: |
          php tests/Component/prepare.php '${{ matrix.illuminate }}' "$RUNNER_TEMP/mediable-components"
          composer update --working-dir="$RUNNER_TEMP/mediable-components" --no-interaction --prefer-dist
          composer audit --working-dir="$RUNNER_TEMP/mediable-components"
      - name: Run bounded MySQL migration regression tests
        env:
          COMPONENT_AUTOLOAD: ${{ runner.temp }}/mediable-components/vendor/autoload.php
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
        run: php tests/Component/run-bounded.php MySqlMigrationTest.php "$RUNNER_TEMP/mysql-junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-${{ matrix.illuminate }}-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/mediable-components/composer.json
            ${{ runner.temp }}/mediable-components/composer.lock
            ${{ runner.temp }}/mysql-junit.xml
